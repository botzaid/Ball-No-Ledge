name: Refresh data

# Keeps the site's data current without anyone touching it:
#  - every 2 hours: re-fetch the all-time player list and this season's page
#    from Wikipedia (results, scorers, appearances, fixtures), rebuild js/history.js
#  - every Monday: re-fetch every source page (player articles, past seasons)
# Changes are committed, and Vercel redeploys the site on each commit to main.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every page (not just the in-season ones)
        type: boolean
        default: false
  schedule:
    - cron: '23 */2 * * *'
    - cron: '41 4 * * 1'
  push:
    paths:
      - tools/source_pages.txt
      - tools/fetch_sources.py
      - research/build_history.py
      - .github/workflows/sources.yml

permissions:
  contents: write

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch Wikipedia sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "23 */2 * * *" ]; then
            python3 tools/fetch_sources.py --quick
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" != "true" ]; then
            python3 tools/fetch_sources.py --quick
          else
            python3 tools/fetch_sources.py
          fi
      - name: Rebuild site data
        run: python3 research/build_history.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research js/history.js
          # Wikipedia revision stamps change even when nothing we use does; only commit real data changes
          if git diff --cached --quiet -- js/history.js && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No data changes"; exit 0
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Refresh data from Wikipedia"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
