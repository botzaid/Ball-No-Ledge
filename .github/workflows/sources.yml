name: Wikipedia sources

# Saves raw wikitext of the articles in tools/source_pages.txt to research/wiki/.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/source_pages.txt
      - tools/fetch_sources.py
      - .github/workflows/sources.yml

permissions:
  contents: write

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 tools/fetch_sources.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git diff --cached --quiet && exit 0
          git commit -m "Save Wikipedia source text for player and season data"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
