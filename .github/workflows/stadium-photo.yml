name: Stadium photo

# Lists candidate Bernabéu photos from Wikimedia Commons, or downloads the one
# chosen in tools/stadium.json, and commits the result back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stadium.json
      - tools/fetch_stadium.py
      - .github/workflows/stadium-photo.yml

permissions:
  contents: write

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stadium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python3 tools/fetch_stadium.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/stadium research/stadium
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Stadium photo from Wikimedia Commons"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
