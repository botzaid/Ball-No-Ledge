name: Site media

# Downloads the stadium and trophy images listed in tools/media.json from
# Wikimedia Commons (or lists candidates to choose from) and commits them.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/media.json
      - tools/fetch_media.py
      - .github/workflows/media.yml

permissions:
  contents: write

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow "rembg[cpu]"
      - run: python3 tools/fetch_media.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- images research
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Site media from Wikimedia Commons"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
